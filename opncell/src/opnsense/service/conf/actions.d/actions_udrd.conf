[start]
command:/usr/local/etc/rc.d/epcudrd start
type:script
message: Starting open5gs-udrd

[stop]
command:/usr/local/etc/rc.d/epcudrd onestop
type:script
message: Stopping open5gs-udrd

[status]
command:/usr/local/etc/rc.d/epcudrd status || exit 0
parameters:
type:script_output
message: Requesting open5gs-udrd status

[restart]
command:/usr/local/etc/rc.d/epcudrd onerestart
type:script
message: Restarting udrd
