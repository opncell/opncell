[start]
command:/usr/local/etc/rc.d/epcscpd start
type:script
message: Starting open5gs-scpd

[stop]
command:/usr/local/etc/rc.d/epcscpd onestop
type:script
message: Stopping open5gs-scpd

[status]
command:/usr/local/etc/rc.d/epcscpd status || exit 0
parameters:
type:script_output
message: Requesting open5gs-scpd status

[restart]
command:/usr/local/etc/rc.d/epcscpd onerestart
type:script
message: Restarting scpd
