[start]
command:/usr/local/etc/rc.d/epcpcfd start
type:script
message: Starting open5gs-pcfd

[stop]
command:/usr/local/etc/rc.d/epcpcfd onestop
type:script
message: Stopping open5gs-pcfd

[status]
command:/usr/local/etc/rc.d/epcpcfd status || exit 0
parameters:
type:script_output
message: Requesting open5gs-pcfd status

[restart]
command:/usr/local/etc/rc.d/epcpcfd onerestart
type:script
message: Restarting pcfd
