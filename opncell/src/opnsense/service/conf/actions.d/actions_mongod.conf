[start]
command:/usr/local/opnsense/scripts/opncell/startMongo.sh
type:script
message: Starting mongod

[stop]
command:/usr/local/etc/rc.d/mongod onestop
type:script
message: Stopping mongod

[status]
command:/usr/local/etc/rc.d/mongod onestatus || exit 0
parameters:
type:script_output
message: Requesting mongod status

[restart]
command:/usr/local/etc/rc.d/mongod onerestart
type:script
message: Restarting mongod
