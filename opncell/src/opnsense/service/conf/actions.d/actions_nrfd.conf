[start]
command:/usr/local/etc/rc.d/epcnrfd start
type:script
message: Starting open5gs-nrfd

[stop]
command:/usr/local/etc/rc.d/epcnrfd onestop
type:script
message: Stopping open5gs-nrfd

[status]
command:/usr/local/etc/rc.d/epcnrfd status || exit 0
parameters:
type:script_output
message: Requesting open5gs-nrfd status

[restart]
command:/usr/local/etc/rc.d/epcnrfd onerestart
type:script
message: Restarting nrfd
