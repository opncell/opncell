[start]
command:/usr/local/etc/rc.d/epcudmd start
type:script
message: Starting open5gs-udmd

[stop]
command:/usr/local/etc/rc.d/epcudmd onestop
type:script
message: Stopping open5gs-udmd

[status]
command:/usr/local/etc/rc.d/epcudmd status || exit 0
parameters:
type:script_output
message: Requesting open5gs-udmd status

[restart]
command:/usr/local/etc/rc.d/epcudmd onerestart
type:script
message: Restarting udmd
