[start]
command:/usr/local/etc/rc.d/epcmmed start
type:script
message: Starting open5gs-mmed

[stop]
command:/usr/local/etc/rc.d/epcmmed onestop
type:script
message: Stopping open5gs-mmed

[status]
command:/usr/local/etc/rc.d/epcmmed status || exit 0
parameters:
type:script_output
message: Requesting open5gs-mmed status


[restart]
command:/usr/local/etc/rc.d/epcmmed onerestart
type:script
message: Restarting mmed
