[start]
command:/usr/local/etc/rc.d/epcsgwcd start
type:script
message: Starting open5gs-sgwcd

[stop]
command:/usr/local/etc/rc.d/epcsgwcd onestop
type:script
message: Stopping open5gs-sgwcd

[status]
command:/usr/local/etc/rc.d/epcsgwcd status || exit 0
parameters:
type:script_output
message: Requesting open5gs-sgwcd status

[restart]
command:/usr/local/etc/rc.d/epcsgwcd onerestart
type:script
message: Restarting sgwcd
