[start]
command:/usr/local/etc/rc.d/epcsmfd start
type:script
message: Starting open5gs-smfd

[stop]
command:/usr/local/etc/rc.d/epcsmfd onestop
type:script
message: Stopping open5gs-smfd

[status]
command:/usr/local/etc/rc.d/epcsmfd status || exit 0
parameters:
type:script_output
message: Requesting open5gs-smfd status

[restart]
command:/usr/local/etc/rc.d/epcsmfd onerestart
type:script
message: Restarting smfd
