[start]
command:/usr/local/etc/rc.d/epcamfd start
type:script
message: Starting open5gs-amfd

[stop]
command:/usr/local/etc/rc.d/epcamfd onestop
type:script
message: Stopping open5gs-amfd

[status]
command:/usr/local/etc/rc.d/epcamfd status || exit 0
parameters:
type:script_output
message: Requesting open5gs-amfd status

[restart]
command:/usr/local/etc/rc.d/epcamfd onerestart
type:script
message: Restarting amfd
