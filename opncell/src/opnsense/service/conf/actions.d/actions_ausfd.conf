[start]
command:/usr/local/etc/rc.d/epcausfd start
type:script
message: Starting open5gs-ausfd

[stop]
command:/usr/local/etc/rc.d/epcausfd onestop
type:script
message: Stopping open5gs-ausfd

[status]
command:/usr/local/etc/rc.d/epcausfd status || exit 0
parameters:
type:script_output
message: Requesting open5gs-ausfd status

[restart]
command:/usr/local/etc/rc.d/epcausfd onerestart
type:script
message: Restarting ausfd
