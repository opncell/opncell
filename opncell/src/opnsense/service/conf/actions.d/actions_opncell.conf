[loadConfiguration]
command:/usr/local/opnsense/scripts/opncell/reconfigure.py
type:script_output
parameters:%s
message: Loading daemon configuration

[verifyBoot]
command:/usr/local/opnsense/scripts/opncell/verify_boot.py
type:script_output
parameters:%s
message: Verifying effective cellular boot settings

[saveUsers]
command: /usr/local/opnsense/scripts/opncell/saveUsers.py
type:script_output
parameters:%s
message:Saving users to HSS database.

[getUser]
command: /usr/local/opnsense/scripts/opncell/getUser.py
type:script_output
parameters:%s
message:Get User from db.

[showUsers]
command:/usr/local/opnsense/scripts/opncell/showUsers.py
type:script_output
parameters:%s
message: getting all Users

[showHnet]
command:/usr/local/opnsense/scripts/opncell/generate_hnet.py
type:script_output
parameters:%s
message: Configuring Hnet

[listHnet]
command:/usr/local/opnsense/scripts/opncell/list_hnet.py
type:script_output
message: Listing existing Hnet keys

[showUsersFiltered]
command:/usr/local/opnsense/scripts/opncell/showUsersFiltered.py
parameters: --sort_by=%s
type:script_output
message: getting all Users

[processNames]
command:/usr/local/opnsense/scripts/opncell/processNames.py
parameters:%s
type:script_output
message: Process names

[deleteUser]
command:/usr/local/opnsense/scripts/opncell/deleteUser.py
type:script_output
parameters:%s
message: Deleting User

[updateUser]
command:/usr/local/opnsense/scripts/opncell/updateUser.py
type:script_output
parameters:%s
message: Updating User

[startMongo]
command:/usr/local/opnsense/scripts/opncell/startMongo.sh
type:script_output
message:Starting mongoDB

[restartMongo]
command:/usr/local/etc/rc.d/mongod onerestart
type:script_output
message:Restarting mongoDB

[stopMongo]
command:/usr/local/opnsense/scripts/opncell/stopMongo.sh
type:script
message:Stopping mongoDB

[saveTuneables]
command:/usr/local/opnsense/scripts/opncell/saveTuneables.py
type:script_output
parameters:%s
message: Loading daemon configuration

[editServerConf]
command:/usr/local/opnsense/scripts/opncell/editSingleService.py
type:script_output
parameters:%s
message: Editing Conf file


[updateSubscriberProfiles]
command:/usr/local/opnsense/scripts/opncell/updateSubscriberProfiles.py
type:script_output
parameters:%s
message: Updating subscriber profiles

[clearLog]
command:/usr/local/opnsense/scripts/opncell/clear_log.py
parameters:%s
type:script_output
message: Clearing cellular log without restarting services

[logSource]
command:/usr/local/opnsense/scripts/opncell/query_log.py
parameters:--source %s
type:script_output
message: Resolving cellular log source

[queryLog]
command:/usr/local/opnsense/scripts/opncell/query_log.py
parameters:--limit %s --offset %s --filter %s --module opncell --filename %s --severity %s --valid_from %s
type:script_output
message: Reading cellular log

[exportLog]
command:/usr/local/opnsense/scripts/opncell/query_log.py
parameters:--limit 0 --offset 0 --filter %s --module opncell --filename %s --severity %s --valid_from %s --output text
type:stream_output
message: Downloading cellular log
