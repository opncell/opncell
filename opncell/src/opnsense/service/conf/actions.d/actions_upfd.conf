[start]
command:/usr/local/etc/rc.d/epcupfd start
type:script
message: Starting open5gs-upfd

[stop]
command:/usr/local/etc/rc.d/epcupfd onestop
type:script
message: Stopping open5gs-upfd

[status]
command:/usr/local/etc/rc.d/epcupfd status || exit 0
parameters:
type:script_output
message: Requesting open5gs-upfd status

[restart]
command:/usr/local/etc/rc.d/epcupfd onerestart
type:script
message: Restarting upfd
