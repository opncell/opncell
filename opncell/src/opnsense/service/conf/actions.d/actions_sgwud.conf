[start]
command:/usr/local/etc/rc.d/epcsgwud start
type:script
message: Starting open5gs-sgwud

[stop]
command:/usr/local/etc/rc.d/epcsgwud onestop
type:script
message: Stopping open5gs-sgwud

[status]
command:/usr/local/etc/rc.d/epcsgwud status || exit 0
parameters:
type:script_output
message: Requesting open5gs-sgwud status

[restart]
command:/usr/local/etc/rc.d/epcsgwud onerestart
type:script
message: Restarting sgwud
