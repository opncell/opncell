[start]
command:/usr/local/etc/rc.d/epcbsfd start
type:script
message: Starting open5gs-bsfd

[stop]
command:/usr/local/etc/rc.d/epcbsfd onestop
type:script
message: Stopping open5gs-bsfd

[status]
command:/usr/local/etc/rc.d/epcbsfd status || exit 0
parameters:
type:script_output
message: Requesting open5gs-bsfd status


[restart]
command:/usr/local/etc/rc.d/epcbsfd onerestart
type:script
message: Restarting bsfd
