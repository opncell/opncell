[start]
command:/usr/local/etc/rc.d/epcnssfd start
type:script
message: Starting open5gs-nssfd

[stop]
command:/usr/local/etc/rc.d/epcnssfd onestop
type:script
message: Stopping open5gs-nssfd

[status]
command:/usr/local/etc/rc.d/epcnssfd status || exit 0
parameters:
type:script_output
message: Requesting open5gs-nssfd status

[restart]
command:/usr/local/etc/rc.d/epcnssfd onerestart
type:script
message: Restarting nssfd
