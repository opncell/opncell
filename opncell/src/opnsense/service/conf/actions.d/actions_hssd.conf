[start]
command:/usr/local/etc/rc.d/epchssd start
type:script
message: Starting open5gs-hssd

[stop]
command:/usr/local/etc/rc.d/epchssd onestop
type:script
message: Stopping open5gs-hssd

[status]
command:/usr/local/etc/rc.d/epchssd status || exit 0
parameters:
type:script_output
message: Requesting open5gs-hssd status

[restart]
command:/usr/local/etc/rc.d/epchssd onerestart
type:script
message: Restarting hssd
