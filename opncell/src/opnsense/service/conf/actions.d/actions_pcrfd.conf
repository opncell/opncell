[start]
command:/usr/local/etc/rc.d/epcpcrfd start
type:script
message: Starting open5gs-pcrfd

[stop]
command:/usr/local/etc/rc.d/epcpcrfd onestop
type:script
message: Stopping open5gs-pcrfd

[status]
command:/usr/local/etc/rc.d/epcpcrfd status || exit 0
parameters:
type:script_output
message: Requesting open5gs-pcrfd status

[restart]
command:/usr/local/etc/rc.d/epcpcrfd onerestart
type:script
message: Restarting pcrfd
